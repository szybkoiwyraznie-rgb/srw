name: Lista ilustracji R2

# Uruchamiany ręcznie albo przez zmianę pliku-żądania (push).
# Integracja GitHuba używana przez agenta ma tylko odczyt Actions, więc
# workflow_dispatch jest dla niej niedostępny. Push do pliku-żądania nie
# dotyczy pull requestów, więc sekrety nie trafiają do kodu PR.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/r2-inventory-request'

permissions:
  contents: read

concurrency:
  group: r2-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Sprawdź AWS CLI
        run: aws --version
      - name: Odczytaj listę plików z R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: '3'
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: srw-images
          R2_PUBLIC_BASE_URL: https://pub-f065608b5a964f3fb44480d8c9df01de.r2.dev
        run: node tools/r2-inventory.mjs "$RUNNER_TEMP/r2-inventory/r2-inventory.json"
      - name: Udostępnij listę jako artefakt
        uses: actions/upload-artifact@v7
        with:
          name: r2-inventory
          path: ${{ runner.temp }}/r2-inventory/r2-inventory.json
          if-no-files-found: error
          retention-days: 7
      # Artefakt jest niedostępny z sandboxa agenta (blob storage); adnotacja jest
      # czytana przez REST API. Zawiera tylko nazwy, rozmiary i daty — bez kluczy.
      - name: Opublikuj listę w adnotacji
        run: |
          # Adnotacja GitHuba jest ucinana po 4096 znakach, więc lista idzie w częściach.
          # Każda część ma ten sam tytuł; pole `part`/`total` pozwala je poskładać w całość.
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const d = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/r2-inventory/r2-inventory.json`, "utf8"));
            const objects = d.objects.map(({ key, size, lastModified }) => ({ key, size, lastModified }));
            const LIMIT = 3000;
            const chunks = [];
            let current = [];
            for (const o of objects) {
              if (current.length && JSON.stringify(current.concat([o])).length > LIMIT) {
                chunks.push(current);
                current = [];
              }
              current.push(o);
            }
            if (current.length) chunks.push(current);
            chunks.forEach((part, index) => {
              const payload = JSON.stringify({
                part: index + 1,
                total: chunks.length,
                ...(index === 0 ? { objectCount: d.objectCount } : {}),
                objects: part,
              });
              const safe = payload.replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A");
              console.log(`::notice title=R2 inventory::${safe}`);
            });
          '
      - name: Podsumowanie
        run: |
          echo 'Lista plików i publiczne adresy są w artefakcie **r2-inventory**.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Bucket nie został zmieniony. Lista nie potwierdza dostępności publicznych URL.' >> "$GITHUB_STEP_SUMMARY"
