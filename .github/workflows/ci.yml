name: Testy

# Sonda 2026-11-09: runy o 18:09 i później kończą się start-up failure (0 jobów)
# przy niezmienionym workflow — komentarz wymusza ponowną walidację pliku.

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Daty stron pochodzą z historii gita — płytki klon by je zafałszował
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Testy integralności
        run: npm test
      - name: Build artefaktu
        run: npm run build
      - name: Podsumowanie
        run: |
          echo "Zbudowano dist/index.html: $(du -h dist/index.html | cut -f1)"
          echo "Stron w bazie: $(ls -1 content/*/*.md | grep -v README | wc -l)"
